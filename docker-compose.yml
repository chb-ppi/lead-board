services:
  db:
    image: supabase/postgres:15.1.0.147
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
    volumes:
      - supabase-db:/var/lib/postgresql/data
      - ./supabase/99999999999998-roles-and-teams.sql:/docker-entrypoint-initdb.d/migrations/99999999999998-roles-and-teams.sql:ro
      - ./supabase/99999999999999-local-role-passwords.sql:/docker-entrypoint-initdb.d/migrations/99999999999999-local-role-passwords.sql:ro
      - ./supabase/99999999999999-z-offer-periods.sql:/docker-entrypoint-initdb.d/migrations/99999999999999-z-offer-periods.sql:ro
      - ./supabase/99999999999999-z-employee-invitations.sql:/docker-entrypoint-initdb.d/migrations/99999999999999-z-employee-invitations.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U postgres && psql -U postgres -d postgres -tAc "select count(*) from pg_roles where rolname in (''authenticator'', ''supabase_auth_admin'') and rolpassword is not null" | grep -qx 2',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.143.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${VITE_SUPABASE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?configure an SMTP host for invitations}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:?configure an SMTP port for invitations}
      GOTRUE_SMTP_USER: ${SMTP_USER:?configure an SMTP user for invitations}
      GOTRUE_SMTP_PASS: ${SMTP_PASSWORD:?configure an SMTP password for invitations}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:?configure an SMTP sender for invitations}
      GOTRUE_SMTP_SENDER_NAME: Lead Board

  rest:
    image: postgrest/postgrest:v12.2.8
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  kong:
    image: kong:2.8.1
    depends_on:
      - auth
      - rest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth
    ports:
      - "8000:8000"
    volumes:
      - ./supabase/kong.yml:/usr/local/kong/kong.yml:ro

  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    depends_on:
      - kong
    ports:
      - "3000:80"

  api:
    image: node:24-alpine
    command: node /app/api/server.mjs
    depends_on:
      - auth
      - rest
    environment:
      AUTH_URL: http://auth:9999
      REST_URL: http://rest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set a Supabase service-role JWT}
      SITE_URL: http://localhost:3000
    volumes:
      - ./api:/app/api:ro

volumes:
  supabase-db:
